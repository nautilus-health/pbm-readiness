<!-- PBM Rule Navigator: paste into a Code / Custom HTML block on nautilushealth.org/PBM -->
<div id="pbm-navigator-wrap" style="max-width:860px;margin:0 auto;">
  <iframe id="pbm-navigator"
    src="https://nautilus-health.github.io/pbm-readiness/"
    title="PBM Rule Navigator"
    style="width:100%;height:900px;border:0;display:block;"
    loading="lazy"></iframe>
</div>
<script>
(function () {
  var f = document.getElementById("pbm-navigator");
  window.addEventListener("message", function (e) {
    if (e.origin !== "https://nautilus-health.github.io" || !e.data) return;
    if (e.data.type === "pbm-readiness-height" && e.data.height) f.style.height = e.data.height + "px";
    if (e.data.type === "pbm-readiness-top") {
      var top = f.getBoundingClientRect().top;
      if (top < 0) window.scrollBy({ top: top - 80, behavior: "smooth" });
    }
  });
})();
</script>
