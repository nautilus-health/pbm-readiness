name = "pbm-readiness"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Let the Worker import the knowledge pack as text.
rules = [{ type = "Text", globs = ["**/*.md"], fallthrough = true }]

[vars]
MODEL = "claude-sonnet-5-5"
EFFORT = "medium"      # low | medium | high; thinking depth before answering
PACK_VERSION = "1.1"
ALLOWED_ORIGINS = "https://nautilus-health.github.io,https://www.nautilushealth.org,https://nautilushealth.org,https://www.contractxray.com,https://contractxray.com"
FREE_QUESTIONS = "5"     # before the email
MAX_QUESTIONS = "10"     # total, after the email
IP_HOURLY_LIMIT = "30"
LOG_QUESTIONS = "true"   # eval period only; set to "false" at launch

[[d1_databases]]
binding = "DB"
database_name = "pbm-readiness"
database_id = "32f24b54-8038-4aca-b2c5-281a0abaf522"

[observability]
enabled = true
